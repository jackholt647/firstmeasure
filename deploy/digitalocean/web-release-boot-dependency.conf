[Unit]
Requires=firstmeasure-release-bootstrap.service
After=firstmeasure-release-bootstrap.service

# cloud-final itself is ordered after multi-user.target. Enabling web under
# multi-user.target would form a cycle and systemd would drop its start job.
# Re-enable the unit after installing this drop-in to move its target link.
[Install]
WantedBy=
WantedBy=cloud-init.target
