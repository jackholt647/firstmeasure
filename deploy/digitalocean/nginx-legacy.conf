# Compatibility (legacy) host. The web tier proxies /measure/internal,
# /measure/sales and /sync.php here with Host app.1m8.ai; anything addressed to
# another host is closed (deploy/digitalocean/security-php-nginx-20261024.md).
server {
    listen 80 default_server;
    server_name _;
    location ^~ /v1/health/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
    location / { return 444; }
}

server {
    listen 80;
    # Add this host's private IP only if a caller reaches it by address.
    server_name app.1m8.ai;
    root /opt/firstmeasure/current/public;
    index index.php index.html;
    client_max_body_size 256m;
    add_header X-Content-Type-Options nosniff always;

    # Retired code, diagnostics and backups are never served.
    location ^~ /includes/ { return 404; }
    location ~ (^|/)unused/ { return 404; }
    location ~ /\.(?!well-known/) { return 404; }
    location ~* (\.(bak|orig|old|swp|save)|~)$ { return 404; }
    # The developer file manager is not part of production.
    location = /api.php { return 404; }
    location = /ide.php { return 404; }
    location = /login.php { return 404; }
    location = /add_user.php { return 404; }
    location = /auth.php { return 404; }
    location = /portal/symlink.php { return 404; }
    location ^~ /storage/measure/internal/organizations/ {
        location ~ \.php$ { return 404; }
        try_files $uri =404;
    }
    location ^~ /storage/ { return 404; }

    location /sites/ { try_files $uri $uri/ /sites/index.php?$query_string; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        # Resolve the immutable release before PHP realpath/opcache lookup.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PROVIDER_KEYS_PATH /etc/firstmeasure/provider-keys.json;
        # Session checks may use the local compatibility Node; every other
        # PHP-to-Node call goes through the web tier (FIRSTMEASURE_API_BASE).
        fastcgi_param FIRSTMEASURE_NODE_BASE_URL http://127.0.0.1:3101/v1/platform;
        fastcgi_param FIRSTMEASURE_API_BASE https://app.1m8.ai/v1/firstmeasure;
        fastcgi_param PLATFORM_SESSION_COOKIE_NAME fm_platform_session;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300s;
    }
}
