# Development compatibility host (deploy/digitalocean/security-php-nginx-20261024.md).
server {
    listen 80 default_server;
    server_name _;
    location ^~ /v1/health/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
    location / { return 444; }
}

server {
    listen 80;
    server_name dev.1m8.ai 10.124.16.5;
    root /opt/firstmeasure/current/public;
    index index.php index.html;
    client_max_body_size 256m;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Content-Type-Options;
    }

    # Retired code, diagnostics and backups are never served.
    location ^~ /includes/ { return 404; }
    location ~ (^|/)unused/ { return 404; }
    location ~ /\.(?!well-known/) { return 404; }
    location ~* (\.(bak|orig|old|swp|save)|~)$ { return 404; }
    location = /portal/symlink.php { return 404; }
    location ^~ /storage/measure/internal/organizations/ {
        location ~ \.php$ { return 404; }
        try_files $uri =404;
    }
    location ^~ /storage/ { return 404; }

    location /sites/ { try_files $uri $uri/ /sites/index.php?$query_string; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        # Resolve the immutable release before PHP realpath/opcache lookup.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PROVIDER_KEYS_PATH /etc/firstmeasure/provider-keys.json;
        fastcgi_param FIRSTMEASURE_NODE_BASE_URL http://127.0.0.1:3201/v1/platform;
        fastcgi_param PLATFORM_SESSION_COOKIE_NAME fm_platform_session_development;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300s;
    }
}
