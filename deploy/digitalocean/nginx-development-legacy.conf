server {
    listen 80;
    server_name dev.1m8.ai 10.124.16.5;
    root /opt/firstmeasure/current/public;
    index index.php index.html;
    client_max_body_size 256m;

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /sites/ { try_files $uri $uri/ /sites/index.php?$query_string; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PROVIDER_KEYS_PATH /etc/firstmeasure/provider-keys.json;
        fastcgi_param FIRSTMEASURE_NODE_BASE_URL http://127.0.0.1:3201/v1/platform;
        fastcgi_param PLATFORM_SESSION_COOKIE_NAME fm_platform_session_development;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300s;
    }
}
