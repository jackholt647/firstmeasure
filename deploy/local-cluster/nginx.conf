events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream firstmeasure_web {
    least_conn;
    server web-a:3101 max_fails=2 fail_timeout=5s;
    server web-b:3101 max_fails=2 fail_timeout=5s;
    keepalive 32;
  }

  upstream firstmeasure_php {
    least_conn;
    server php-a:9000;
    server php-b:9000;
  }

  server {
    listen 8080;
    root /app/public;
    index index.php index.html;
    client_max_body_size 256m;

    location ^~ /v1/ {
      proxy_pass http://firstmeasure_web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    # These older PHP applications still own local SQLite/filesystem state and
    # deliberately stay on the fixed legacy service during the first cutover.
    location ^~ /measure/internal/ { proxy_pass http://legacy-web:8080; }
    location ^~ /measure/sales/ { proxy_pass http://legacy-web:8080; }
    location = /api.php { proxy_pass http://legacy-web:8080; }
    location = /ide.php { proxy_pass http://legacy-web:8080; }
    location = /login.php { proxy_pass http://legacy-web:8080; }
    location = /add_user.php { proxy_pass http://legacy-web:8080; }
    location = /sync.php { proxy_pass http://legacy-web:8080; }

    location /sites/ {
      try_files $uri $uri/ /sites/index.php?$query_string;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      try_files $uri =404;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass firstmeasure_php;
      fastcgi_read_timeout 300s;
    }
  }
}
