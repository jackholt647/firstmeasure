plugins { id 'com.android.application' }
// Keep local builds possible until both Firebase Android clients are provisioned.
if (file('google-services.json').exists() || (file('src/development/google-services.json').exists() && file('src/production/google-services.json').exists())) {
    apply plugin: 'com.google.gms.google-services'
}
android {
    namespace 'ai.firstmeasure.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'ai.firstmeasure.mobile'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '1.0.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'environment'
    productFlavors {
        development {
            dimension 'environment'
            applicationIdSuffix '.dev'
            resValue 'string', 'app_name', 'FirstMate'
            buildConfigField 'String', 'PORTAL_ORIGIN', '"https://dev.1m8.ai"'
        }
        production {
            dimension 'environment'
            resValue 'string', 'app_name', 'FirstMate'
            buildConfigField 'String', 'PORTAL_ORIGIN', '"https://1m8.ai"'
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { animationsDisabled true }
}
dependencies {
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'androidx.camera:camera-video:1.5.3'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
}

// Exercise the actual web/native preview composition, not a transparent mock page.
def cameraTestAssets = layout.buildDirectory.dir('generated/camera-test-assets')
tasks.register('syncCameraTestAssets', Copy) {
    from rootProject.file('../../../public/libraries/apps/firstmeasure/order/exteriors.js')
    into cameraTestAssets
}
android.sourceSets.androidTest.assets.srcDir(cameraTestAssets)
tasks.configureEach { if (name.startsWith('merge') && name.endsWith('AndroidTestAssets')) dependsOn('syncCameraTestAssets') }
