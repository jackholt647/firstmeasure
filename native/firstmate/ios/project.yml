name: FirstMate
options:
  bundleIdPrefix: ai.firstmeasure
  deploymentTarget:
    iOS: '16.0'
configs:
  Development: debug
  Production: release
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.2'
    CURRENT_PROJECT_VERSION: '3'
    CODE_SIGN_STYLE: Automatic
  configs:
    Development:
      PRODUCT_BUNDLE_IDENTIFIER: ai.firstmeasure.mobile.dev
      PORTAL_ORIGIN: https:/$()/dev.1m8.ai
      APP_ENVIRONMENT: development
      APNS_ENVIRONMENT: development
      APP_DISPLAY_NAME: FirstMate
    Production:
      PRODUCT_BUNDLE_IDENTIFIER: ai.firstmeasure.mobile
      PORTAL_ORIGIN: https:/$()/1m8.ai
      APP_ENVIRONMENT: production
      APNS_ENVIRONMENT: production
      APP_DISPLAY_NAME: FirstMate
targets:
  FirstMate:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        UILaunchScreen: {}
        PortalOrigin: $(PORTAL_ORIGIN)
        AppEnvironment: $(APP_ENVIRONMENT)
        NSCameraUsageDescription: Take project and property photos for your reports.
        NSPhotoLibraryUsageDescription: Choose project and property photos to upload.
        NSMicrophoneUsageDescription: Use the microphone for calls and audio notes you start.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Push.entitlements
  FirstMateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: FirstMate}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ai.firstmeasure.mobile.tests
  FirstMateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: FirstMate}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ai.firstmeasure.mobile.uitests
schemes:
  FirstMate:
    build:
      targets:
        FirstMate: all
    test:
      config: Development
      targets: [FirstMateTests, FirstMateUITests]
    run:
      config: Development
    archive:
      config: Production
