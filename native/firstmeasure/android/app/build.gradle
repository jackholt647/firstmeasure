plugins { id 'com.android.application' }
android {
    namespace 'ai.firstmeasure.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'ai.firstmeasure.mobile'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.0.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'environment'
    productFlavors {
        development {
            dimension 'environment'
            applicationIdSuffix '.dev'
            resValue 'string', 'app_name', 'FirstMate'
            buildConfigField 'String', 'PORTAL_ORIGIN', '"https://dev.1m8.ai"'
        }
        production {
            dimension 'environment'
            resValue 'string', 'app_name', 'FirstMate'
            buildConfigField 'String', 'PORTAL_ORIGIN', '"https://1m8.ai"'
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { animationsDisabled true }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
}
