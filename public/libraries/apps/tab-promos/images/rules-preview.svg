<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" fill="#f5f6f8"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="62" rx="0" fill="#202124" stroke="none"/><text x="28" y="39" fill="#fff" font-size="22" font-weight="700">FirstMate</text><text x="160" y="39" fill="#b7bcc4" font-size="12" font-weight="700">/  PROJECT SCOPE</text><text x="30" y="108" fill="#202124" font-size="26" font-weight="700">Your calculations. Not a one-size-fits-all list.</text><rect x="30" y="133" width="270" height="466" rx="8" fill="#fff" stroke="none"/><text x="50" y="168" fill="#737984" font-size="12" font-weight="700">MY PRODUCT CATALOG</text><rect x="43" y="190" width="243" height="48" rx="8" fill="#fce9e7" stroke="none"/><text x="57" y="219" fill="#b62820" font-size="14" font-weight="700">Architectural shingles</text><rect x="43" y="252" width="243" height="48" rx="8" fill="#f7f8fa" stroke="none"/><text x="57" y="281" fill="#59616a" font-size="14" font-weight="700">Synthetic underlayment</text><rect x="43" y="314" width="243" height="48" rx="8" fill="#f7f8fa" stroke="none"/><text x="57" y="343" fill="#59616a" font-size="14" font-weight="700">Starter strip</text><rect x="43" y="376" width="243" height="48" rx="8" fill="#f7f8fa" stroke="none"/><text x="57" y="405" fill="#59616a" font-size="14" font-weight="700">Ridge &amp; hip cap</text><rect x="43" y="438" width="243" height="48" rx="8" fill="#f7f8fa" stroke="none"/><text x="57" y="467" fill="#59616a" font-size="14" font-weight="700">Custom accessory</text><text x="51" y="553" fill="#737984" font-size="14" font-weight="400">Add the products you use.</text><text x="51" y="575" fill="#737984" font-size="14" font-weight="400">Keep the rules that work.</text><rect x="322" y="133" width="608" height="466" rx="8" fill="#fff" stroke="none"/><text x="348" y="174" fill="#202124" font-size="22" font-weight="700">Architectural shingles</text><text x="348" y="200" fill="#737984" font-size="14" font-weight="400">Custom quantity rule</text><text x="348" y="229" fill="#737984" font-size="11" font-weight="700">MEASUREMENT</text><rect x="348" y="241" width="260" height="48" rx="7" fill="#fafbfc" stroke="#e1e3e7"/><text x="360" y="271" fill="#202124" font-size="15" font-weight="600">Roof area</text><text x="628" y="229" fill="#737984" font-size="11" font-weight="700">WASTE ALLOWANCE</text><rect x="628" y="241" width="274" height="48" rx="7" fill="#fafbfc" stroke="#e1e3e7"/><text x="640" y="271" fill="#202124" font-size="15" font-weight="600">10%</text><text x="348" y="322" fill="#737984" font-size="11" font-weight="700">COVERAGE PER BUNDLE</text><rect x="348" y="334" width="260" height="48" rx="7" fill="#fafbfc" stroke="#e1e3e7"/><text x="360" y="364" fill="#202124" font-size="15" font-weight="600">33 sq ft</text><text x="628" y="322" fill="#737984" font-size="11" font-weight="700">ROUNDING</text><rect x="628" y="334" width="274" height="48" rx="7" fill="#fafbfc" stroke="#e1e3e7"/><text x="640" y="364" fill="#202124" font-size="15" font-weight="600">Round up to whole bundles</text><rect x="348" y="416" width="554" height="73" rx="8" fill="#202124" stroke="none"/><text x="366" y="445" fill="#c0c5cd" font-size="10" font-weight="700">YOUR RULE</text><text x="366" y="474" fill="#fff" font-size="20" font-weight="700">Round up ( Roof area × 1.10 ÷ 33 )</text><rect x="348" y="511" width="554" height="58" rx="8" fill="#eaf5ee" stroke="none"/><text x="365" y="535" fill="#41684e" font-size="13" font-weight="400">Example: 3,320 sq ft</text><text x="365" y="556" fill="#245f36" font-size="17" font-weight="700">111 bundles · ready for your review</text></g></svg>