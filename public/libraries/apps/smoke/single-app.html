<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FirstMate Single App Smoke</title>
  <style>
    html,body,#smokeRoot{height:100%;margin:0}
    body{font-family:Inter,Arial,sans-serif;background:#fff;color:#101828}
    .smoke-left{display:none}
    #smokeStatus{position:fixed;right:10px;bottom:10px;z-index:20;border:1px solid #e4e7ec;border-radius:8px;background:#fff;padding:8px 10px;font-size:12px;font-weight:900;color:#475467;box-shadow:0 10px 24px rgba(15,23,42,.12)}
  </style>
  <script>
    (function(){
      var params = new URLSearchParams(location.search || '');
      var appId = params.get('app') || 'portal.photos_feed';
      var cacheBust = params.get('cacheBust') || String(Date.now());
      window.__FM_APP_SMOKE_CASE = { id: appId, cacheBust: cacheBust };
      window.addEventListener('message', function(event){
        var data = event.data || {};
        if (data.type !== 'fm-app-smoke-result') return;
        window.__FM_SINGLE_APP_RESULT = data;
        var status = document.getElementById('smokeStatus');
        if (status) status.textContent = (data.ok ? 'Pass' : 'Fail') + ': ' + (data.detail || data.error || appId);
      });
    })();
  </script>
  <script src="../../app-runtime/firstmate-embeddable-apps.js"></script>
  <script src="../../app-runtime/firstmate-app-context.js"></script>
  <script src="independent-load-frame.js?v=20260626-materials-color-portal3"></script>
</head>
<body>
  <div id="smokeRoot"></div>
  <div id="smokeLeft" class="smoke-left"></div>
  <div id="smokeOverlay"></div>
  <div id="smokeStatus">Running</div>
</body>
</html>
