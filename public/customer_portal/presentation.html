<!doctype html>
<!-- A presentation opened from a link sent to the customer. The token is in the
     URL fragment (never sent to the server in a request line or logged as a
     path); the page runs the same player the salesperson presents with, and
     its buttons mean the same thing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Presentation</title>
<link rel="stylesheet" href="../libraries/fontawesome/css/all.min.css" onerror="this.remove()">
<style>
html,body{margin:0;height:100%;background:#0b0d12;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#e7eaf0}
#host{position:fixed;inset:0}
.note{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
.note[hidden]{display:none}
.note div{max-width:420px}
.note h1{font-size:20px;margin:0 0 8px}
.note p{margin:0;color:#aeb5c2;font-size:14px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(17,20,28,.94);color:#fff;font-size:13px;font-weight:600;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;max-width:90vw}
</style>
</head>
<body>
<div id="host"></div>
<div class="note" id="note"><div><h1>Opening your presentation…</h1><p></p></div></div>
<script src="../libraries/doc-model/firstmate-doc-model.js"></script>
<script src="../libraries/doc-markdown/firstmate-markdown.js?v=20261010"></script>
<script src="../libraries/doc-renderer/firstmate-doc-renderer.js"></script>
<script src="../libraries/doc-widgets/firstmate-doc-widgets.js"></script>
<script src="../libraries/doc-parts/firstmate-doc-parts.js"></script>
<script src="../libraries/doc-present/firstmate-doc-present.js"></script>
<script>
(function () {
  'use strict';
  const token = decodeURIComponent(location.hash.replace(/^#/, ''));
  const note = document.getElementById('note');
  const say = (title, body) => { note.hidden = false; note.querySelector('h1').textContent = title; note.querySelector('p').textContent = body || ''; };
  let toastTimer = 0;
  function toast(message) {
    document.querySelectorAll('.toast').forEach((el) => el.remove());
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.textContent = message;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 6000);
  }
  if (!token || !window.FMDocPresent || !window.FMDocParts) { say('This link is not complete', 'Open the link from your email again, or ask us to send a new one.'); return; }

  const base = '../v1/document-modules/public/presentations/' + encodeURIComponent(token);
  async function call(path, method, body) {
    const response = await fetch(base + path, { method: method || 'GET', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'omit', cache: 'no-store' });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) { const error = new Error(data.message || 'Something went wrong.'); error.code = data.error; throw error; }
    return data;
  }

  call('').then((data) => {
    let current = data.presentation || {};
    const parts = window.FMDocParts;
    const colors = (current.org && current.org.colors) || {};
    const primary = colors.primary || colors.brand || colors.accent || '';
    document.title = (current.org && current.org.name ? current.org.name + ' — ' : '') + (current.name || 'Presentation');
    note.hidden = true;
    // Writes go one at a time, each on the revision the one before returned.
    let writes = Promise.resolve();
    const canChoose = current.access === 'choose' && current.frozen !== true;
    let finishing = false;
    /** Where a finished presentation rests on the customer's own device. */
    function ending(headline, detail, url) {
      const sheet = document.createElement('div');
      sheet.style.cssText = 'position:fixed;inset:0;z-index:50;background:#0b0d12;color:#fff;display:grid;place-items:center;padding:24px;font-family:Montserrat,Segoe UI,Arial,sans-serif';
      const box = document.createElement('div');
      box.style.cssText = 'max-width:560px;text-align:center';
      const mark = document.createElement('div');
      mark.style.cssText = 'width:76px;height:76px;border-radius:50%;background:' + (primary || '#d93025') + ';display:grid;place-items:center;margin:0 auto 26px;font-size:34px;font-weight:800';
      mark.textContent = '✓';
      const h = document.createElement('h1');
      h.style.cssText = 'margin:0 0 12px;font-size:32px;font-weight:800;line-height:1.15';
      h.textContent = headline;
      const text = document.createElement('p');
      text.style.cssText = 'margin:0 0 28px;font-size:17px;line-height:1.5;color:#c9ced8';
      text.textContent = detail;
      box.append(mark, h, text);
      if (url) {
        const open = document.createElement('a');
        open.href = url;
        open.textContent = 'Open my estimate';
        open.style.cssText = 'display:inline-block;border-radius:12px;background:' + (primary || '#d93025') + ';color:#fff;font-weight:800;font-size:15px;padding:15px 26px;text-decoration:none';
        box.append(open);
      }
      sheet.append(box);
      document.body.append(sheet);
    }
    /** Sign or send: the agreement is made from what was chosen, exactly as when we present it. */
    async function finish(name) {
      if (finishing) return;
      if (!canChoose) { toast('This presentation is for viewing. Contact us and we will send your agreement.'); return; }
      finishing = true;
      try {
        await writes.catch(() => {});
        const result = await call('/submit', 'POST', { expectedRevision: current.revision });
        current = result.presentation || current;
        const url = (result.signing && result.signing.portalUrl) || (result.signTarget && result.signTarget.signers && result.signTarget.signers[0] && result.signTarget.signers[0].portalUrl) || '';
        if (name === 'sign' && url) { location.assign(url); return; }
        // The customer is already on their own device with the link we sent: there is
        // nothing to hand back and no address to ask for. Say where it went, and let them open it.
        ending(url ? 'Thank you. Your estimate is ready.' : 'Thank you.', url ? 'We have emailed it to you with everything you chose. You can also open it now to read, save or approve it.' : 'We have your selections and will be in touch with your agreement.', url);
        return;
      } catch (error) {
        toast(error.message || 'That did not go through. Please try again.');
      }
      finishing = false;
    }
    const player = window.FMDocPresent.mount(document.getElementById('host'), {
      document: current.layout,
      widgetData: current.widgetData || {},
      themeContext: { overrides: primary ? { '--fm-primary': primary, '--fm-color-primary': primary } : {} },
      live: {
        state: parts.stateFromPresentation(current),
        readonly: !canChoose,
        onInput: (input) => (writes = writes.catch(() => {}).then(async () => {
          const write = parts.inputWrite(input);
          if (!write) return null;
          current = (await call('/inputs', 'PATCH', Object.assign({ expectedRevision: current.revision }, write))).presentation;
          return parts.stateFromPresentation(current);
        })),
        onError: (error) => toast(error && error.message ? error.message : 'That choice could not be saved.')
      },
      onAction: (name) => { if (name === 'sign' || name === 'send') finish(name); },
      onExit: () => {}
    });
    window.presentation = player;
  }).catch((error) => {
    const gone = error.code === 'public_link_expired' || error.code === 'public_link_revoked' || error.code === 'public_link_not_found';
    say(gone ? 'This link is no longer active' : 'We could not open your presentation', gone ? 'Ask us to send you a new one.' : (error.message || 'Please try again in a moment.'));
  });
})();
</script>
</body>
</html>
