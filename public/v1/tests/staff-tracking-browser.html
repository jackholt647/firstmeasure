window.Portal={cfg:{endpoints:{firstmeasure:location.origin+'/v1/firstmeasure',platform:location.origin+'/v1/platform'}},escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));},registerPlugin(p){const b=document.createElement('button');b.textContent=p.title;b.id='nav-'+p.id;b.onclick=()=>this.switchView(p.id,b);document.getElementById('portalPluginNav').append(b);},async switchView(id){document.querySelectorAll('main>section').forEach(e=>e.style.display=e.id==='view-'+id?'':'none');}};
