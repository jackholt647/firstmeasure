name: FirstMeasure CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: public/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public/v1/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and complete smoke suite
        env:
          FIRSTMEASURE_INTERNAL_API_SECRET: ci-test-internal-service-secret
        run: npm run test:smoke
      - name: PostgreSQL FirstMeasure integration
        run: npm run test:firstmeasure:postgres:local
      - name: Full-house access with PostgreSQL
        run: node tests/run-embedded-postgres.mjs tests/full-house-access.test.ts
      - name: Install browser for editor regression tests
        run: npx playwright-core install --with-deps chromium
      - name: Exterior geometry and shared editor panes
        working-directory: .
        run: node --test dev/*.test.cjs
      - name: PostgreSQL platform integration
        run: npm run test:platform:postgres:local
      - name: PostgreSQL shared-store integration
        run: npm run test:cluster:postgres:local
      - name: PostgreSQL publication snapshots and action receipts
        run: node tests/run-embedded-postgres.mjs tests/publication-postgres.test.ts
      - name: Publication builders and instance workflows
        run: npm run test:publication:ui
      - name: Validate local cluster definition
        working-directory: .
        run: docker compose -f deploy/local-cluster/compose.yml config --quiet
      - name: Replacement-node release delivery safety checks
        working-directory: .
        run: |
          node --test deploy/digitalocean/release-delivery.test.mjs
          python3 -B -m unittest discover -s deploy/digitalocean -p 'test_release_*.py'
          python3 -B -m unittest discover -s deploy/digitalocean -p 'test_web_bootstrap.py'
          for script in activate-release.sh prepare-web-release.sh publish-web-release.sh bootstrap-web-release.sh production-web-user-data.sh; do
            bash -n "deploy/digitalocean/$script"
          done
