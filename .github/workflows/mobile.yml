name: Mobile apps
on:
  workflow_dispatch:
  push:
    branches: ['codex/mobile-platform']
    paths: ['native/firstmeasure/**', 'public/libraries/phone-features/**', 'public/v1/mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['native/firstmeasure/**', 'public/libraries/phone-features/**', 'public/v1/mobile/**', '.github/workflows/mobile.yml']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: public/v1/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: node --experimental-sqlite --import tsx --test --test-force-exit tests/mobile-api.test.ts tests/phone-features.test.mjs tests/localization-api.test.ts tests/localization-browser.test.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: chmod +x native/firstmeasure/android/gradlew
      - run: native/firstmeasure/android/gradlew -p native/firstmeasure/android assembleDevelopmentDebug testDevelopmentDebugUnitTest bundleProductionRelease
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: native/firstmeasure/android/gradlew -p native/firstmeasure/android connectedDevelopmentDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-builds-and-test-results
          path: |
            native/firstmeasure/android/app/build/outputs/apk/development/debug/*.apk
            native/firstmeasure/android/app/build/outputs/bundle/productionRelease/*.aab
            native/firstmeasure/android/app/build/reports/
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build and test iPhone simulator
        run: bash native/firstmeasure/scripts/test-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-and-test-results
          path: |
            native/firstmeasure/ios/build/TestResults-*.xcresult
            native/firstmeasure/ios/build/DerivedData/Build/Products/Development-iphonesimulator/
