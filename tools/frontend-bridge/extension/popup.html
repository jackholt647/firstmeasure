<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FirstMate Dev Bridge</title>
  <style>
    :root{color-scheme:light dark;--fg:#101828;--muted:#667085;--line:#e4e7ec;--bg:#fff;--chip:#eff4ff;--accent:#1d4ed8;--warn:#b54708}
    @media (prefers-color-scheme:dark){:root{--fg:#f2f4f7;--muted:#98a2b3;--line:#344054;--bg:#101828;--chip:#1e2a4a;--accent:#84adff;--warn:#fdb022}}
    body{margin:0;width:380px;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
    header img{width:20px;height:20px}
    header strong{flex:1}
    .state{font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--accent)}
    .state.down{color:var(--muted)}
    section{padding:10px 14px;border-bottom:1px solid var(--line)}
    h3{margin:0 0 6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
    ul{margin:0;padding:0;list-style:none}
    li{padding:3px 0;font:12px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}
    li small{display:block;font-family:system-ui,sans-serif;color:var(--warn)}
    code{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--chip);padding:1px 4px;border-radius:4px;word-break:break-all}
    label{display:flex;align-items:center;gap:8px;padding:3px 0}
    .muted{color:var(--muted)}
    .row{display:flex;gap:8px;margin-top:8px}
    button{flex:1;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:inherit;font-weight:600;padding:6px 8px;cursor:pointer}
    button:hover{border-color:var(--accent)}
    input[type=number]{width:80px;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg)}
  </style>
</head>
<body>
  <header><img src="icons/icon-32.png" alt=""><strong>FirstMate Dev Bridge</strong><span id="state" class="state down">…</span></header>
  <section id="summary"></section>
  <section id="files" hidden><h3>Local files on dev.1m8.ai</h3><ul id="file-list"></ul></section>
  <section id="pending" hidden><h3>Needs a dev rollout to see</h3><ul id="pending-list"></ul></section>
  <section>
    <label><input type="checkbox" id="enabled"> Use local files on dev.1m8.ai</label>
    <label><input type="checkbox" id="autoReload"> Reload the page when a script changes</label>
    <label>Bridge port <input type="number" id="port" min="1024" max="65535"></label>
    <div class="row"><button id="reload">Reload dev tabs</button><button id="reconnect">Reconnect</button></div>
    <div class="row" id="shots-row" hidden><button id="shots">Allow screenshots</button></div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
