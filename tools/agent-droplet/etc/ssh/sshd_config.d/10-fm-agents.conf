# FirstMate agent droplet: key-only SSH. Agents log in as `agent`; root cannot log in.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
# Desktop app sessions forward ports (Claude in Chrome); the jackpc tunnel needs a remote forward.
AllowTcpForwarding yes
GatewayPorts no
ClientAliveInterval 30
ClientAliveCountMax 4

# Jack's PC opens a reverse tunnel here and can do nothing else.
Match User jackpc
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:2222
    PermitTTY no
    AllowStreamLocalForwarding no
    ForceCommand /usr/sbin/nologin
